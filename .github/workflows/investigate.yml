name: investigate

# Temporary: attributes the host/guest transport cost on each platform and
# CPython version. Dispatch-only apart from changes to the probe itself.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_transport.py
      - .github/workflows/investigate.yml
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Environment
        run: |
          python -VV
          python -c "import platform;print(platform.platform(), platform.machine())"
      - name: Transport probe, no Monty and no codec
        run: |
          python scripts/probe_transport.py --mode transport \
            --sizes 1000,8000,16000,32000,60000,200000 \
            --rounds 3 --timeout 20 | tee probe.jsonl
      - name: Product path under the documented 5 second wall clock
        run: |
          python scripts/probe_transport.py --mode scriptspell \
            --sizes 1000,60000 --rounds 2 | tee -a probe.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}-py${{ matrix.python }}
          path: probe.jsonl
          if-no-files-found: warn